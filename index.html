<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AutoCrop Pro</title>
    <link rel="icon" type="image/png" href="/logo.png" />
    <!-- Apply the saved colour scheme before first paint (avoids a white flash in dark mode). -->
    <script>
      try {
        var s = localStorage.getItem("mantine-color-scheme-value") || "auto";
        var dark = s === "dark" || (s === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-mantine-color-scheme", dark ? "dark" : "light");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
