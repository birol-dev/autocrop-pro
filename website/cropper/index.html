  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#141414" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <!-- Apply the saved colour scheme before first paint (avoids a flash of the wrong theme). -->
  <script>
    try {
      var s = localStorage.getItem("mantine-color-scheme-value") || "auto";
      var dark = s === "dark" || (s === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.setAttribute("data-mantine-color-scheme", dark ? "dark" : "light");
    } catch (e) {}
  </script>
